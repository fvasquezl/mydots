# herdr configuration
# https://herdr.dev/docs/config-reference/

[theme]
name = "tokyo-night"

[terminal]
# nueva pane/tab/workspace hereda el cwd del pane/workspace de origen
new_cwd = "follow"

[keys]
# prefix estilo tmux (cambialo a "ctrl+a" si vienes de esa muscle memory)
prefix = "ctrl+b"

# navegación entre paneles con hjkl, igual que en nvim
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
zoom = "prefix+z"

# moverse rápido entre apps/proyectos (workspaces) y entre tabs dentro de uno
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
previous_workspace = "prefix+["
next_workspace = "prefix+]"
new_tab = "prefix+c"
switch_tab = "prefix+1..9"

# abre nvim al instante en un pane temporal sin romper tu layout actual
[[keys.command]]
key = "prefix+shift+e"
type = "pane"
command = "nvim"
